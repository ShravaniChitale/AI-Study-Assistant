<!DOCTYPE html>
<html>
<head>
    <title>Search Notes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Search Notes</h2>

    <form method="POST">

        <input
            type="text"
            name="keyword"
            class="form-control"
            placeholder="Enter keyword">

        <br>

        <button class="btn btn-primary">
            Search
        </button>

    </form>

    <hr>

    {% for note in results %}

        <div class="card mb-2">

            <div class="card-body">

                {{ note.filename }}

            </div>

        </div>

    {% endfor %}

</div>

</body>
</html>
