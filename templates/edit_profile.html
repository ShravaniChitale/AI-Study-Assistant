<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Edit Profile</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            value="{{ user.username }}"
            class="form-control"
            required>

        <br>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            class="form-control"
            required>

        <br>

        <button class="btn btn-success">
            Save Changes
        </button>

    </form>

</div>

</body>
</html>
