<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Quiz</h2>

    <form method="POST" action="/submit_quiz">

        {% for question in quiz %}

        <div class="card mb-3">

            <div class="card-body">

                <h5>
                    Q{{ loop.index }}
                </h5>

                <p>{{ question }}</p>

                <input type="radio"
                       name="q{{ loop.index }}"
                       value="A">
                A

                <br>

                <input type="radio"
                       name="q{{ loop.index }}"
                       value="B">
                B

                <br>

                <input type="radio"
                       name="q{{ loop.index }}"
                       value="C">
                C

                <br>

                <input type="radio"
                       name="q{{ loop.index }}"
                       value="D">
                D

            </div>

        </div>

        {% endfor %}

        <button class="btn btn-success">
            Submit Quiz
        </button>

    </form>

</div>

</body>
</html>
